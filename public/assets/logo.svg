<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 60" role="img" aria-label="Jonaki Pothe logo - a glowing firefly">
  <defs>
    <radialGradient id="glowBody" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD166" stop-opacity="1"/>
      <stop offset="60%" stop-color="#FFD166" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFD166" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowDot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD166" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFD166" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="bigBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <!-- Glow halo -->
  <ellipse cx="85" cy="30" rx="14" ry="10" fill="url(#glowBody)" filter="url(#bigBlur)" opacity="0.8"/>
  <!-- Wings -->
  <ellipse cx="80" cy="23" rx="8" ry="4" fill="#B9A7E8" opacity="0.5" transform="rotate(-20 80 23)"/>
  <ellipse cx="80" cy="37" rx="8" ry="4" fill="#B9A7E8" opacity="0.5" transform="rotate(20 80 37)"/>
  <!-- Body -->
  <ellipse cx="85" cy="30" rx="10" ry="6" fill="#14213D"/>
  <!-- Abdomen glow (tail) -->
  <ellipse cx="90" cy="30" rx="5" ry="4" fill="#FFD166"/>
  <ellipse cx="90" cy="30" rx="5" ry="4" fill="url(#glowBody)" filter="url(#blur)"/>
  <!-- Eyes -->
  <circle cx="77" cy="28" r="1.5" fill="#FFD166"/>
  <!-- Trail dots forming a path -->
  <circle cx="68" cy="34" r="3" fill="#FFD166" filter="url(#blur)" opacity="0.9"/>
  <circle cx="68" cy="34" r="1.5" fill="#FFD166"/>
  <circle cx="55" cy="38" r="2.5" fill="#FFD166" filter="url(#blur)" opacity="0.75"/>
  <circle cx="55" cy="38" r="1.2" fill="#FFD166"/>
  <circle cx="42" cy="36" r="2" fill="#FFD166" filter="url(#blur)" opacity="0.6"/>
  <circle cx="42" cy="36" r="1" fill="#FFD166"/>
  <circle cx="30" cy="32" r="1.8" fill="#FFD166" filter="url(#blur)" opacity="0.45"/>
  <circle cx="30" cy="32" r="0.9" fill="#FFD166"/>
  <circle cx="18" cy="30" r="1.5" fill="#FFD166" filter="url(#blur)" opacity="0.3"/>
  <circle cx="18" cy="30" r="0.7" fill="#FFD166"/>
</svg>
