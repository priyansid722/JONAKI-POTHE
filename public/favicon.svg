<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="8" fill="#14213D"/>
  <!-- Firefly body -->
  <ellipse cx="20" cy="16" rx="6" ry="4" fill="#14213D"/>
  <ellipse cx="22" cy="16" rx="4" ry="3" fill="#FFD166"/>
  <!-- Wings -->
  <ellipse cx="18" cy="12" rx="5" ry="2.5" fill="#B9A7E8" opacity="0.6" transform="rotate(-20 18 12)"/>
  <ellipse cx="18" cy="20" rx="5" ry="2.5" fill="#B9A7E8" opacity="0.6" transform="rotate(20 18 20)"/>
  <!-- Trail dots -->
  <circle cx="13" cy="18" r="2"   fill="#FFD166" opacity="0.9"/>
  <circle cx="8"  cy="17" r="1.5" fill="#FFD166" opacity="0.65"/>
  <circle cx="4"  cy="16" r="1"   fill="#FFD166" opacity="0.4"/>
</svg>
