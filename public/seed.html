<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Seed Database — Jonaki Pothe</title>
  <meta name="robots" content="noindex, nofollow" />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Nunito:wght@400;600&display=swap"
    rel="stylesheet"
  />
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background: #FFF8EC;
      color: #1B1B3A;
      max-width: 560px;
      margin: 40px auto;
      padding: 20px;
    }
    h1 { font-family: 'Poppins', sans-serif; color: #14213D; }
    .warning {
      background: #fff3cd;
      border-left: 4px solid #F4A259;
      border-radius: 8px;
      padding: 14px 16px;
      margin: 16px 0;
      font-size: 0.95rem;
    }
    .btn {
      background: #F4A259;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 1rem;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      display: inline-block;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #log {
      margin-top: 24px;
      background: #1B1B3A;
      color: #FFD166;
      border-radius: 10px;
      padding: 16px;
      font-family: monospace;
      font-size: 0.88rem;
      line-height: 1.8;
      max-height: 400px;
      overflow-y: auto;
      display: none;
    }
    #auth-status { margin-bottom: 12px; font-size: 0.95rem; color: #555; }
  </style>
</head>
<body>
  <h1>🌱 Seed Database</h1>

  <div class="warning">
    <strong>⚠️ Warning:</strong> This page writes sample data to your Firestore database.
    Run it <strong>only once</strong>, and only while signed in as an admin.
    Running it multiple times will create duplicate entries.
  </div>

  <div id="auth-status">Checking sign-in status…</div>
  <button id="seed-btn" class="btn" disabled>Seed Database</button>

  <pre id="log"></pre>

<script type="module">
  import { db, auth }     from '/js/firebase-config.js';
  import { onAuthChange } from '/js/auth.js';
  import { isAdmin }      from '/js/auth.js';
  import seedFirestore    from '/data/seed-data.js';

  const authStatus = document.getElementById('auth-status');
  const seedBtn    = document.getElementById('seed-btn');
  const log        = document.getElementById('log');

  function logLine(msg) {
    log.style.display = 'block';
    // escape HTML
    const div = document.createElement('div');
    div.textContent = msg;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  onAuthChange(async (user) => {
    if (!user) {
      authStatus.textContent = '🔒 You are not signed in. Please sign in as admin first.';
      authStatus.style.color = '#E5646E';
      seedBtn.disabled = true;
      return;
    }

    const admin = await isAdmin();
    if (!admin) {
      authStatus.textContent = `⛔ Signed in as ${user.displayName || user.email}, but this account does not have admin access.`;
      authStatus.style.color = '#E5646E';
      seedBtn.disabled = true;
      return;
    }

    authStatus.textContent = `✅ Signed in as admin: ${user.displayName || user.email}`;
    authStatus.style.color = '#4CAF82';
    seedBtn.disabled = false;
  });

  seedBtn.addEventListener('click', async () => {
    seedBtn.disabled = true;
    seedBtn.textContent = 'Seeding…';
    log.innerHTML = '';

    try {
      await seedFirestore(db, logLine);
    } catch (err) {
      logLine('❌ Fatal error: ' + err.message);
    }

    seedBtn.textContent = 'Done (do not run again)';
  });
</script>
</body>
</html>
